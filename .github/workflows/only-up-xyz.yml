name: ONLY UP 1.0 - XYZ V2.8
on:
  push:
    paths:
      - ".github/workflows/only-up-xyz.yml"
      - "XYZ V2.8.apk"
      - "file_000000006edc8207a50dbf996378292c.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless apksigner zipalign imagemagick python3
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version
          mkdir -p work output

      - name: Decode XYZ APK
        run: |
          test -s "XYZ V2.8.apk"
          test -s "file_000000006edc8207a50dbf996378292c.png"
          java -jar apktool.jar d -f "XYZ V2.8.apk" -o work/decoded

      - name: Rebrand accessible resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, xml.etree.ElementTree as ET

          root = Path("work/decoded")
          logo = Path("file_000000006edc8207a50dbf996378292c.png")
          text_ext = {".xml", ".json", ".html", ".htm", ".txt", ".properties", ".smali", ".js"}
          translations = {
              "Jangan tampilkan lagi": "Don't show again",
              "SELAMAT DATANG KEMBALI": "WELCOME BACK",
              "JOIN CHANNEL WHATSAPP.": "JOIN TELEGRAM CHANNEL.",
              "JOIN WHATSAPP": "JOIN TELEGRAM",
              "Tidak bisa membuka saluran. Pasang WhatsApp atau browser, lalu coba lagi.": "Unable to open the channel. Install Telegram or a browser, then try again.",
              "Buka Debugging nirkabel > Pasangkan dengan kode. Perluas notifikasi ONLY UP 1.0 lalu ketuk MASUKKAN KODE. Kode juga dapat dimasukkan melalui aplikasi.": "Open Wireless debugging > Pair with code. Expand the ONLY UP 1.0 notification and tap ENTER CODE. You can also enter the code in the app.",
              "Buka proxy ONLY UP 1.0; seret untuk memindahkan": "Open the ONLY UP 1.0 proxy; drag to move",
              "Di opsi developer, buka Debugging nirkabel > Pasangkan dengan kode. Lalu ketuk MASUKKAN KODE pada notifikasi ini.": "In Developer options, open Wireless debugging > Pair with code. Then tap ENTER CODE in this notification.",
              "Pengaturan tidak dapat dibuka. Buka opsi developer di Android.": "Unable to open Settings. Open Developer options on Android."
          }
          url_pattern = re.compile(r"https?://(?:t\\.me|telegram\\.me|wa\\.me|www\\.whatsapp\\.com/channel)/[^\\s\"'<>]*", re.I)
          changed = []
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  original = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              value = url_pattern.sub("https://t.me/sr_panel_zone", original)
              value = value.replace("XYZ V2.8", "ONLY UP 1.0").replace("XYZ 2.8", "ONLY UP 1.0")
              value = value.replace("XYZ 2.8", "ONLY UP 1.0")
              for source, target in translations.items():
                  value = value.replace(source, target)
              if value != original:
                  p.write_text(value, encoding="utf-8")
                  changed.append(str(p.relative_to(root)))

          manifest = root / "AndroidManifest.xml"
          tree = ET.parse(manifest)
          mroot = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          mroot.set(android + "label", "ONLY UP 1.0")
          mroot.set(android + "icon", "@drawable/icon")
          mroot.set(android + "roundIcon", "@drawable/icon")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Replace known logo/icon assets with the uploaded white-background logo.
          targets = []
          for name in ["brand_logo.png", "icon.xml", "notification_icon.xml", "modjav_logo.xml"]:
              target = root / "res" / "drawable" / name
              if not target.exists():
                  continue
              png = target.with_suffix(".png")
              subprocess.run(["convert", str(logo), "-background", "white", "-alpha", "remove", "-alpha", "off", "-resize", "460x460", "-gravity", "center", "-extent", "512x512", str(png)], check=True)
              if target.suffix == ".xml":
                  target.unlink()
              targets.append(str(png.relative_to(root)))

          # Export review material so resource strings can be audited before final release.
          output = Path("output")
          output.mkdir(exist_ok=True)
          review = []
          for p in sorted(root.rglob("strings.xml")):
              review.append(f"### {p.relative_to(root)}\\n" + p.read_text(encoding="utf-8", errors="replace"))
          popup = root / "res" / "layout" / "modjav_popup.xml"
          if popup.exists():
              (output / "modjav_popup.xml").write_text(popup.read_text(encoding="utf-8", errors="replace"), encoding="utf-8")
              review.append("### modjav_popup.xml\\n" + popup.read_text(encoding="utf-8", errors="replace"))
          (output / "strings-inventory.txt").write_text("\\n\\n".join(review), encoding="utf-8")
          (output / "changed-text-files.txt").write_text("\\n".join(changed), encoding="utf-8")
          (output / "icon-targets.txt").write_text("\\n".join(targets), encoding="utf-8")
          print(f"Updated text files: {len(changed)}; logo resources: {len(targets)}")
          PY

      - name: Build and sign
        run: |
          java -jar apktool.jar b work/decoded -o output/ONLY-UP-unsigned.apk
          zipalign -f 4 output/ONLY-UP-unsigned.apk output/ONLY-UP-aligned.apk
          keytool -genkeypair -v -keystore output/only-up-debug.keystore -storepass android -keypass android -alias onlyup -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ONLY UP 1.0,O=Shakin Al Mahmud"
          apksigner sign --ks output/only-up-debug.keystore --ks-pass pass:android --key-pass pass:android --out output/ONLY-UP-1.0.apk output/ONLY-UP-aligned.apk
          apksigner verify --verbose output/ONLY-UP-1.0.apk
          aapt dump badging output/ONLY-UP-1.0.apk | head -n 8

      - name: Upload build and review files
        uses: actions/upload-artifact@v4
        with:
          name: ONLY-UP-1.0-XYZ
          path: |
            output/ONLY-UP-1.0.apk
            output/strings-inventory.txt
            output/icon-targets.txt
          if-no-files-found: error
