              "7 tidak valid. Injeksi ulang file lalu mulai ulang game.": "Invalid. Re-inject the file and restart the game.",
              "). Periksa izin modul.": "Check module permissions.",
              ". Pemuat dan izin modul harus tersedia.": "A compatible loader and module permissions are required.",
              "ACTIVE PROXY tidak dapat dibuka. Periksa izin tampil di atas aplikasi lain, lalu coba lagi.": "Unable to open ACTIVE PROXY. Check the display-over-other-apps permission, then try again.",
              "ACTIVE PROXY tidak dapat ditampilkan.": "ACTIVE PROXY cannot be displayed.",
              "ACTIVE PROXY tidak dapat ditampilkan. Periksa izin tampil di atas aplikasi lain.": "ACTIVE PROXY cannot be displayed. Check the display-over-other-apps permission.",
              "ADB TERHUBUNG. ACTIVE PROXY siap dibuka.": "ADB CONNECTED. ACTIVE PROXY is ready to open.",
              "ADB TERHUBUNG. Kembali ke ": "ADB CONNECTED. Return to ",
