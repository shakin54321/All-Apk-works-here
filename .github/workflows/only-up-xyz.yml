          logo = Path("file_000000006edc8207a50dbf996378292c.png")
          text_ext = {".xml", ".json", ".html", ".htm", ".txt", ".properties", ".smali", ".js"}
          translations = {
              "Jangan tampilkan lagi": "Don't show again",
              "SELAMAT DATANG KEMBALI": "WELCOME BACK",
