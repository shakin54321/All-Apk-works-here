              "Key tidak valid atau sudah dinonaktifkan. Periksa lalu coba lagi.": "The key is invalid or has been disabled. Check it and try again.",
              "Kode tidak valid. Masukkan enam digit yang ditampilkan Android.": "Invalid code. Enter the six digits shown by Android.",
