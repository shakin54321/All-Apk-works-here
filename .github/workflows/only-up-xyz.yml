              "Modul tidak tersedia. Buka game dengan pemuat yang kompatibel dan diizinkan.": "The module is unavailable. Open the game with a compatible, authorized loader.",
              "Nilai status FOV tidak valid": "Invalid FOV status value",
              "Notifikasi diblokir. Masukkan kode di aplikasi.": "Notifications are blocked. Enter the code in the app.",
              "ACTIVE PROXY aktif": "ACTIVE PROXY is active",
              "Operasi gagal.": "Operation failed.",
              "Penyandingan dengan kode memerlukan Android 11 atau lebih baru.": "Pairing with a code requires Android 11 or later.",
              "Penyandingan melalui notifikasi sedang berlangsung. Tunggu hasilnya.": "Notification-based pairing is in progress. Wait for the result.",
              "Penyandingan menunggu kode baru. Ketuk AKTIFKAN lagi.": "Pairing is waiting for a new code. Tap ENABLE again.",
              "Penyandingan sedang berlangsung. Tunggu hasilnya di notifikasi.": "Pairing is in progress. Wait for the result in the notification.",
              "Penyandingan tidak ditemukan. Buka Pasangkan dengan kode di Android, lalu coba lagi.": "Pairing was not found. Open Pair with code on Android, then try again.",
              "Penyandingan, koneksi, dan izin proxy.": "Pairing, connection, and proxy permissions.",
              "Pilih folder game Android/data/com.dts.freefireth/files.": "Select the game folder Android/data/com.dts.freefireth/files.",
              "Pilih tepat Android/data/com.dts.freefireth/files. Jika Android memblokir folder ini, perangkat memerlukan ADB; 32 bit tidak menghapus pembatasan.": "Select exactly Android/data/com.dts.freefireth/files. If Android blocks this folder, the device requires ADB; 32-bit mode does not remove this restriction.",
              "Respons ADB tidak valid. Sambungkan ulang ADB.": "Invalid ADB response. Reconnect ADB.",
              "STATUS BELUM PASTI. Menyambungkan ulang dan menonaktifkan fitur": "STATUS UNCERTAIN. Reconnecting and disabling the feature",
              "Sambungkan ulang ADB melalui AKTIFKAN untuk membuka ACTIVE PROXY.": "Reconnect ADB using ENABLE to open ACTIVE PROXY.",
              "Sambungkan, injeksi file, lalu buka proxy.": "Connect, inject the file, then open the proxy.",
              "Seret, minimalkan, atau ketuk Tutup.": "Drag, minimize, or tap Close.",
              "Server belum siap atau tidak dapat dihubungi. Periksa internet, lalu coba lagi.": "The server is not ready or cannot be reached. Check your internet connection and try again.",
              "Status FOV tidak valid": "Invalid FOV status",
              "Tidak ada aplikasi yang dapat membuka tautan.": "No app is available to open this link.",
              "Tidak dapat menyelesaikan operasi. Periksa debugging nirkabel, sambungkan ulang ADB, lalu coba lagi.": "Unable to complete the operation. Check Wireless debugging, reconnect ADB, then try again.",
              "Transfer gagal. Sambungkan ulang ADB lalu coba lagi.": "Transfer failed. Reconnect ADB and try again.",
              "Tunggu pemeriksaan ADB selesai. Proses ini memerlukan waktu hingga 10 detik.": "Wait for the ADB check to finish. This may take up to 10 seconds.",
              "Tunggu proses penyambungan selesai, lalu coba lagi.": "Wait for the connection process to finish, then try again.",
              "Tunggu proses selesai sebelum mengganti mode.": "Wait for the process to finish before changing modes.",
              "Tutup game sebelum menginjeksi file.": "Close the game before injecting the file.",
              "Versi ini sudah tidak berlaku. Buka saluran untuk mendapatkan APK terbaru.": "This version is no longer supported. Open the channel to get the latest APK.",
              "Wi-Fi mati. Aktifkan Wi-Fi dan debugging nirkabel untuk menyambungkan ulang.": "Wi-Fi is off. Enable Wi-Fi and Wireless debugging to reconnect.",
              "Pengaturan": "Settings",
              "Batal": "Cancel",
              "Pasangkan": "Pair",
              "Penyandingan ADB": "ADB Pairing",
              "Penyandingan": "Pairing",
              "Pilih": "Select",
              "Tutup": "Close",
              "Gagal": "Failed",
              "ACTIVE PROXY sekarang tersedia.": "ACTIVE PROXY is now available.",
              "ADB TERHUBUNG. Ketuk INJECT PROXY.": "ADB CONNECTED. Tap INJECT PROXY.",
              "ADB terputus. Sambungkan ulang ADB.": "ADB disconnected. Reconnect ADB.",
              "ADB terputus. Periksa debugging nirkabel lalu sambungkan ulang ADB.": "ADB disconnected. Check Wireless debugging, then reconnect ADB.",
              "AKSES FOLDER TERSEDIA. Injeksi file tanpa ADB.": "FOLDER ACCESS AVAILABLE. Inject the file without ADB.",
              "Android menolak pembuatan file": "Android denied file creation.",
              "Fitur tidak dikenal: ": "Unknown feature: ",
              "Injeksi terlalu lama dan dihentikan. Periksa debugging nirkabel lalu sambungkan ulang ADB.": "Injection timed out and was stopped. Check Wireless debugging, then reconnect ADB.",
              "Injeksi terlalu lama. Periksa koneksi lalu sambungkan ulang ADB.": "Injection timed out. Check the connection, then reconnect ADB.",
              "Ketuk AKTIFKAN untuk menyandingkan. Jika sudah, aplikasi akan mencoba menyambungkan ulang otomatis.": "Tap ENABLE to pair. If already paired, the app will try to reconnect automatically.",
              "Ketuk INJECT PROXY terlebih dahulu.": "Tap INJECT PROXY first.",
              "Koneksi ADB": "ADB connection",
              "Menyandingkan dan memeriksa koneksi": "Pairing and checking the connection",
              "Pemilih folder tidak tersedia di Android ini.": "The folder picker is unavailable on this Android version.",
              "Penulisan terlalu lama. Periksa akses folder game lalu coba lagi.": "Writing timed out. Check game-folder access and try again.",
              "PILIH SALAH SATU AIM.": "SELECT AN AIM OPTION.",
              "periksa akses folder": "check folder access",
              "lalu ketuk INJECT PROXY.": "then tap INJECT PROXY.",
              "AKSES FOLDER": "FOLDER ACCESS",
              "FITUR NONAKTIF": "FEATURE DISABLED",
              "SIAP DIAKTIFKAN": "READY TO ENABLE",
              "MEMERIKSA KONEKSI ADB": "CHECKING ADB CONNECTION",
              "MENGIRIM FILE": "SENDING FILE",
              "MENUNGGU GAME": "WAITING FOR GAME",
              "MENYIAPKAN FOLDER GAME": "PREPARING GAME FOLDER",
              "MODE AKSES": "ACCESS MODE",
              "NONAKTIFKAN": "DISABLE",
              "pilih mode aim": "choose aim mode",
              "tidak merespons": "not responding",
              "Injeksi ulang file lalu mulai ulang game.": "Re-inject the file, then restart the game.",
              "Android menolak pembuatan file": "Android denied file creation.",
              "Ketuk AKTIFKAN": "Tap ENABLE",
              "Pilih salah satu": "Choose one",
              "Koneksi": "Connection",
              "Injeksi": "Injection",
              "FILE BERHASIL DIINJEKSI DAN DIPERIKSA.": "FILE INJECTED AND VERIFIED SUCCESSFULLY.",
              "Aplikasi tidak dapat diverifikasi. Instal ulang": "The app could not be verified. Reinstall",
              "Periksa izin tampil di atas aplikasi lain.": "Check the display-over-other-apps permission.",
              "Penulisan ditolak": "File write was denied",
              "Perintah ADB gagal (": "ADB command failed (",
              "Respons ADB terlalu panjang.": "ADB response is too long.",
              "Aktifkan ": "Enable ",
              "Perintah ": "Command ",
              "Periksa izin modul.": "Check module permissions.",
              "Koneksi ADB disconnected. Enable Wireless debugging, then reconnect ADB.": "ADB connection disconnected. Enable Wireless debugging, then reconnect ADB.",
              "Masukkan ": "Enter "
          }

          url_pattern = re.compile(r"""(?i)(?:https?://)?(?:www\.)?(?:t\.me|telegram\.me|telegram\.org|wa\.me|whatsapp\.com|api\.whatsapp\.com|chat\.whatsapp\.com)/[^\s"'<>]*""")
          changed = []
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  original = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              value = url_pattern.sub("https://t.me/sr_panel_zone", original)
              value = value.replace("XYZ V2.8", "ONLY UP 1.0").replace("XYZ 2.8", "ONLY UP 1.0")
              for source, target in translations.items():
                  value = value.replace(source, target)
              if value != original:
                  p.write_text(value, encoding="utf-8")
                  changed.append(str(p.relative_to(root)))

          manifest = root / "AndroidManifest.xml"
          tree = ET.parse(manifest)
          mroot = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          mroot.set(android + "label", "ONLY UP 1.0")
          mroot.set(android + "icon", "@drawable/icon")
          mroot.set(android + "roundIcon", "@drawable/icon")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Replace known app, popup, and notification logo resources.
          targets = []
          for name in ["brand_logo.png", "icon.xml", "notification_icon.xml", "modjav_logo.xml"]:
              target = root / "res" / "drawable" / name
              if not target.exists():
                  continue
              png = target.with_suffix(".png")
              subprocess.run(["convert", str(logo), "-background", "white", "-alpha", "remove", "-alpha", "off", "-resize", "460x460", "-gravity", "center", "-extent", "512x512", str(png)], check=True)
              if target.suffix == ".xml":
                  target.unlink()
              targets.append(str(png.relative_to(root)))

          # Add the requested author credit to the existing popup card.
          popup = root / "res" / "layout" / "modjav_popup.xml"
          if popup.exists():
              ptree = ET.parse(popup)
              proot = ptree.getroot()
              vertical = next((e for e in proot.iter() if e.tag.split("}")[-1] == "LinearLayout" and e.get(android + "orientation") == "vertical"), None)
              if vertical is not None and not any("Credits: Shakin Al Mahmud" in (e.get(android + "text") or "") for e in vertical):
                  credit = ET.Element("TextView", {
                      android + "text": "Credits: Shakin Al Mahmud",
                      android + "textSize": "10.0sp",
                      android + "textColor": "#71829a",
                      android + "gravity": "center",
                      android + "layout_width": "match_parent",
                      android + "layout_height": "wrap_content",
                      android + "layout_marginTop": "8.0dp",
                      android + "fontFamily": "sans-serif"
                  })
                  vertical.append(credit)
                  ptree.write(popup, encoding="utf-8", xml_declaration=True)
                  ET.register_namespace("android", "http://schemas.android.com/apk/res/android")

          output = Path("output")
          output.mkdir(exist_ok=True)
          review = []
          for p in sorted(root.rglob("strings.xml")):
              review.append(f"### {p.relative_to(root)}\\n" + p.read_text(encoding="utf-8", errors="replace"))
          if popup.exists():
              popup_text = popup.read_text(encoding="utf-8", errors="replace")
              (output / "modjav_popup.xml").write_text(popup_text, encoding="utf-8")
              review.append("### modjav_popup.xml\\n" + popup_text)
          (output / "strings-inventory.txt").write_text("\\n\\n".join(review), encoding="utf-8")
          (output / "changed-text-files.txt").write_text("\\n".join(changed), encoding="utf-8")
          (output / "icon-targets.txt").write_text("\\n".join(targets), encoding="utf-8")
          print(f"Updated text files: {len(changed)}; logo resources: {len(targets)}")
          PY

      - name: Build and sign
        run: |
          java -jar apktool.jar b work/decoded -o output/ONLY-UP-unsigned.apk
          zipalign -f 4 output/ONLY-UP-unsigned.apk output/ONLY-UP-aligned.apk
          keytool -genkeypair -v -keystore output/only-up-debug.keystore -storepass android -keypass android -alias onlyup -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ONLY UP 1.0,O=Shakin Al Mahmud"
          apksigner sign --ks output/only-up-debug.keystore --ks-pass pass:android --key-pass pass:android --out output/ONLY-UP-1.0.apk output/ONLY-UP-aligned.apk
          apksigner verify --verbose output/ONLY-UP-1.0.apk

      - name: Upload build and review files
        uses: actions/upload-artifact@v4
        with:
          name: ONLY-UP-1.0-XYZ
          path: |
            output/ONLY-UP-1.0.apk
            output/strings-inventory.txt
            output/icon-targets.txt
          if-no-files-found: error

# Rebuild requested after resource translation and branding updates.
