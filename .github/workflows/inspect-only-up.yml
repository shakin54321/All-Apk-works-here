name: Inspect ONLY UP 1.0 app structure

on:
  push:
    paths:
      - ".github/workflows/inspect-only-up.yml"
      - "ONLY-UP-1.0.apk"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install APK inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
      - name: Decode and inspect app entry points
        run: |
          set -euo pipefail
          test -s "ONLY-UP-1.0.apk"
          java -jar apktool.jar d -f "ONLY-UP-1.0.apk" -o decoded
          mkdir -p report
          cp decoded/AndroidManifest.xml report/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("decoded")
          out = []
          manifest = (root / "AndroidManifest.xml").read_text(errors="replace")
          out.append("=== MANIFEST ACTIVITIES / LAUNCHER ===")
          for line in manifest.splitlines():
              if any(x in line for x in ("activity", "MAIN", "LAUNCHER", "application", "package=")):
                  out.append(line.strip())
          out.append("\\n=== RESOURCE HITS: HUBUNGKAN / CONNECT ===")
          for p in (root / "res").rglob("*"):
              if p.is_file() and p.suffix in {".xml", ".arsc"}:
                  try: data = p.read_text(errors="replace")
                  except Exception: continue
                  if re.search(r"HUBUNGKAN|Connect", data, re.I):
                      out.append(f"FILE: {p}")
                      for n, line in enumerate(data.splitlines(), 1):
                          if re.search(r"HUBUNGKAN|Connect", line, re.I):
                              out.append(f"{n}: {line.strip()[:500]}")
          out.append("\\n=== ALL DECODED FILE HITS: HUBUNGKAN / CONNECT ===")
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.suffix not in {".png", ".jpg", ".jpeg", ".webp", ".so", ".arsc"}:
                  try: data = p.read_text(errors="replace")
                  except Exception: continue
                  if re.search(r"HUBUNGKAN|Connect", data, re.I):
                      out.append(f"FILE: {p.relative_to(root)}")
                      for n, line in enumerate(data.splitlines(), 1):
                          if re.search(r"HUBUNGKAN|Connect", line, re.I):
                              out.append(f"{n}: {line.strip()[:500]}")
          out.append("\\n=== LAYOUTS ===")
          for p in sorted((root / "res" / "layout").glob("*.xml")) if (root / "res" / "layout").exists() else []:
              out.append(str(p.relative_to(root)))
          out.append("\\n=== DEX / SMALI ENTRY CLASSES ===")
          for p in sorted(root.glob("smali*/**/*.smali")):
              s = p.read_text(errors="replace")
              if "onCreate(Landroid/os/Bundle;)V" in s and ("setContentView" in s or "AppCompatActivity" in s or "Activity;" in s):
                  out.append(str(p.relative_to(root)))
          Path("report/inspection.txt").write_text("\\n".join(out), encoding="utf-8")
          print("\\n".join(out[:300]))
          PY
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: only-up-structure-report
          path: report/
          retention-days: 7
